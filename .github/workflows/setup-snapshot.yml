name: setup snapshot qualification

on:
  push:
    branches: [version-one]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Commands are fixed; only the literal OS/Python matrices parameterize jobs.
# No event/user text, secrets, deployment permissions or executable interpolations.
permissions:
  contents: read

jobs:
  full-suite:
    name: Setup full suite — Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Full unchanged plugin suite plus snapshot contracts
        shell: bash
        run: bash scripts/run_tests.sh -q
      - name: Whitespace check
        shell: bash
        run: git diff-tree --check --root -r HEAD

  windows-archive-contracts:
    name: Windows archive contracts (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Snapshot-only contracts (not native plugin runtime support)
        shell: bash
        run: bash scripts/run_tests.sh tests/skills/test_version_one_snapshot.py tests/skills/test_setup_patch_101.py -q
